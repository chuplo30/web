[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["js/**", "clyde/**"]

[functions.obfuscate]
  included_files = ["js/**", "clyde/**"]

[[redirects]]
  from = "/api/obfuscate"
  to = "/.netlify/functions/obfuscate"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
