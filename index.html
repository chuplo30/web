<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WAN Obfuscate</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="header">
        <div class="logo">&lt;/&gt; WAN Obfuscate</div>
        <div>
          <span class="badge">WAN VM</span>
          <span class="badge">98% Luau</span>
          <span class="nav">
            <a href="docs.html">Tài liệu</a>
            <a href="docs.html#api">API</a>
          </span>
        </div>
      </div>

      <div class="row" style="align-items:center">
        <span class="label">Name:</span>
        <input type="text" id="fname" value="obfuscated" />
      </div>

      <div class="label">Input Lua / Luau</div>
      <div class="editor">
        <textarea id="inputLua" placeholder="Paste full Luau script..."></textarea>
      </div>

      <div class="row">
        <label class="btn btn-upload">upload .lua
          <input type="file" id="fileInput" accept=".lua,.txt" hidden />
        </label>
        <button class="btn btn-run" id="btnObf">▶ Obfuscate</button>
      </div>

      <div class="label">Output</div>
      <div class="editor">
        <textarea id="outputLua" readonly placeholder="Result..."></textarea>
      </div>

      <button class="btn btn-dl" id="btnDl" disabled>Download</button>
      <div class="status" id="status">Ready. Full pack xor20+hex+xor20+base94 · setmetatable shell · no loadstring · VM run</div>
      <div class="footer">WAN OBFUSCATE · pack full default</div>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
